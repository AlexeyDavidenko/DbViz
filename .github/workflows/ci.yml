name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DbViz.sln
      - name: Build
        run: dotnet build DbViz.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DbViz.sln --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Read-only guard check (all dictionary queries)
        run: dotnet run --project src/DbViz.Cli --configuration Release --no-build -- queries
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
